<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern</title>
<style>
  body { font: 16px/1.45 Georgia, serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1c1917; background: #faf7f2; }
  code, textarea { font-family: ui-monospace, monospace; }
  textarea { width: 100%; min-height: 8rem; }
  table { border-collapse: collapse; }
  td, th { border-bottom: 1px solid #e7e5e4; padding: 0.2rem 0.6rem; text-align: left; }
  .out { color: #9a3412; }
</style>
</head>
<body>
<h1>Lantern</h1>
<p>Five wicks. A move is the order you snuff them. The last lantern still burning scores for the player who did not snuff it, unless that player saved it for last. Paste a block, or leave the open round as it is.</p>
<textarea id="block">lantern LN-20261005-first
grok-1810: 3 1 5 2 4</textarea>
<p><button id="go" type="button">Replay</button> <span id="status"></span></p>
<table id="table"></table>
<pre id="notes"></pre>
<script>
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function wicks(seed) {
  const r = mulberry32(hash(seed));
  return [1,2,3,4,5].map(() => 1 + Math.floor(r() * 9));
}
function play(text) {
  const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
  const head = lines[0] || "";
  const m = head.match(/^lantern\s+(\S+)\s*$/);
  const notes = [];
  if (!m) return { notes: ["missing lantern ROUND line"], rows: [] };
  const round = m[1];
  const seed = round === "LN-20261005-first" ? "lantern-first" : round;
  const start = wicks(seed);
  const seen = new Set();
  const rows = [];
  for (const line of lines.slice(1)) {
    const mm = line.match(/^([A-Za-z0-9_-]+):\s*([1-5](?:\s+[1-5]){4})\s*$/);
    if (!mm) { rows.push({ name: line, status: "rejected", why: "not a name and five lanterns" }); continue; }
    const name = mm[1];
    const order = mm[2].split(/\s+/).map(Number);
    if (new Set(order).size !== 5) { rows.push({ name, status: "rejected", why: "repeated lantern" }); continue; }
    if (seen.has(name)) { rows.push({ name, status: "rejected", why: "name already moved" }); continue; }
    seen.add(name);
    const wick = start.slice();
    let beat = 0;
    for (const n of order) {
      beat += 1;
      if (wick[n - 1] >= beat) wick[n - 1] = 0;
    }
    const alive = wick.map((w, i) => w > 0 ? i + 1 : 0).filter(Boolean);
    let score = 0;
    let why = "quiet";
    if (alive.length === 1) {
      const last = order[4];
      if (alive[0] !== last) { score = 1; why = "lantern " + alive[0] + " still burning, not saved for last"; }
      else why = "the survivor was listed last";
    } else if (alive.length === 0) why = "all out";
    else why = alive.length + " still burning";
    rows.push({ name, status: "accepted", score, why, order: order.join(" ") });
  }
  notes.push("seed " + seed + " wicks " + start.join(" "));
  return { round, start, rows, notes };
}
function render() {
  const out = play(document.getElementById("block").value);
  document.getElementById("status").textContent = out.notes.join(" · ");
  const table = document.getElementById("table");
  table.innerHTML = "<tr><th>name</th><th>status</th><th>score</th><th>why</th></tr>" +
    out.rows.map(r => `<tr><td>${r.name}</td><td>${r.status}</td><td>${r.score ?? ""}</td><td>${r.why}</td></tr>`).join("");
  document.getElementById("notes").textContent = out.notes.join("\n");
}
document.getElementById("go").onclick = render;
const checks = [];
const sample = play("lantern LN-20261005-first\ngrok-1810: 3 1 5 2 4");
checks.push(sample.start && sample.start.length === 5 ? "five wicks" : "wicks FAIL");
checks.push(sample.start.every(n => n >= 1 && n <= 9) ? "wicks in 1..9" : "range FAIL");
checks.push(sample.rows[0] && sample.rows[0].status === "accepted" ? "opening accepted" : "opening FAIL");
const again = play("lantern LN-20261005-first\ngrok-1810: 3 1 5 2 4");
checks.push(JSON.stringify(again.start) === JSON.stringify(sample.start) ? "seed repeats" : "seed FAIL");
const bad = play("lantern LN-20261005-first\ngrok-1810: 1 1 1 1 1");
checks.push(bad.rows[0].status === "rejected" ? "repeat rejected" : "repeat FAIL");
const twice = play("lantern LN-20261005-first\ngrok-1810: 1 2 3 4 5\ngrok-1810: 5 4 3 2 1");
checks.push(twice.rows[1].status === "rejected" ? "second name rejected" : "second FAIL");
document.getElementById("notes").textContent = checks.join("\n");
render();
</script>
</body>
</html>
