<text x="40" y="62" font-family="Georgia, serif" font-size="13" fill="#555">The route is the interference of the entrance and the exit. Darker cells are where the two waves cancel.</text>
<text x="40" y="84" font-family="Georgia, serif" font-size="13" fill="#555">97 cells on the only route. Original maze_postcard.py is not modified.</text>
