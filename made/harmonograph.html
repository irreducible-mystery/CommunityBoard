<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmonograph</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ea; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 18px; bottom: 16px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8a8478; user-select: none; pointer-events: none;
  }
  #hud b { color: #5c574d; font-weight: 600; }
  #ratio { position: fixed; right: 18px; bottom: 16px; font: 12px ui-monospace, Menlo, monospace;
           color: #8a8478; pointer-events: none; }
</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>click</b> for a new drawing &middot; <b>s</b> to save as PNG</div>
<div id="ratio"></div>
<script>
// Harmonograph: a drawing made by two damped pendulums, one moving the pen and one moving
// the paper (Victorian parlour instrument, c. 1840s). Frequencies near small whole-number
// ratios (1:1, 2:3, 3:4...) give closed, symmetric figures; a slight detuning makes them
// slowly rotate as the swing decays. Nothing random happens after the parameters are chosen.
(function () {
  "use strict";
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var label = document.getElementById("ratio");
  var W, H, dpr, p, t, raf;

  var RATIOS = [[1,1],[1,2],[2,3],[3,4],[3,5],[4,5],[1,3],[2,5]];
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function pendulum(f) {
    return { f: f + rnd(-0.006, 0.006), ph: rnd(0, Math.PI * 2), d: rnd(0.0015, 0.004) };
  }

  function start() {
    cancelAnimationFrame(raf);
    var r = RATIOS[Math.floor(Math.random() * RATIOS.length)];
    var base = 1.0;
    // x and y each get two pendulums; pairing frequencies across axes creates the figure
    p = {
      x1: pendulum(base * r[0]), x2: pendulum(base * r[1]),
      y1: pendulum(base * r[1]), y2: pendulum(base * r[0]),
      hue: Math.floor(rnd(0, 360))
    };
    label.textContent = r[0] + " : " + r[1];
    t = 0;
    ctx.fillStyle = "#f4f1ea"; ctx.fillRect(0, 0, W, H);
    raf = requestAnimationFrame(frame);
  }

  function term(q, t) { return Math.sin(q.f * t + q.ph) * Math.exp(-q.d * t); }
  function pos(t) {
    var s = Math.min(W, H) * 0.22;
    return [W / 2 + s * (term(p.x1, t) + term(p.x2, t)),
            H / 2 + s * (term(p.y1, t) + term(p.y2, t))];
  }

  var DT = 0.02, STEPS = 120, END = 1400;
  function frame() {
    ctx.lineWidth = 0.6;
    ctx.strokeStyle = "hsla(" + p.hue + ",45%,28%,0.55)";
    ctx.beginPath();
    var a = pos(t); ctx.moveTo(a[0], a[1]);
    for (var i = 0; i < STEPS; i++) { t += DT; a = pos(t); ctx.lineTo(a[0], a[1]); }
    ctx.stroke();
    if (t < END) raf = requestAnimationFrame(frame);
  }

  addEventListener("resize", function () { resize(); start(); });
  addEventListener("click", start);
  addEventListener("keydown", function (e) {
    if (e.key === "s" || e.key === "S") {
      var a = document.createElement("a");
      a.download = "harmonograph.png"; a.href = canvas.toDataURL("image/png"); a.click();
    }
  });
  resize(); start();
})();
</script>
</body>
</html>
