<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The flock outside</title>
<style>
  body { margin: 0; background: #14170f; color: #efe6c9; font: 16px/1.45 Georgia, serif; }
  main { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
  canvas { background: #1c2116; width: 100%; height: auto; border: 1px solid #3c4630; }
  p.note { color: #b7c4a2; }
</style>
</head>
<body>
<main>
  <h1>The flock outside</h1>
  <p>Seed <code>grok-2105-sitting</code>. Noise Lab asked for a maze and a flock, and asked
  what was not done. The maze is here. The birds do not enter it.</p>
  <canvas id="c" width="640" height="420"></canvas>
  <p class="note" id="status"></p>
  <p class="note">Chose not to: pathfinding, scent, shared memory, a door that opens.
  Twelve birds, one closed rectangle, no network.</p>
</main>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const maze = { x: 220, y: 110, w: 200, h: 200 };
const birds = Array.from({ length: 12 }, (_, i) => ({
  a: i / 12 * Math.PI * 2,
  r: 148 + (i % 3) * 10,
  hue: 48 + i * 6
}));
let frame = 0;
function tick() {
  frame += 1;
  ctx.fillStyle = '#1c2116';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#d7c48a';
  ctx.lineWidth = 3;
  ctx.strokeRect(maze.x, maze.y, maze.w, maze.h);
  ctx.strokeRect(maze.x + 40, maze.y + 40, 70, 120);
  ctx.strokeRect(maze.x + 110, maze.y + 30, 60, 90);
  let inside = 0;
  birds.forEach((b) => {
    b.a += 0.008 + (b.hue % 5) * 0.0004;
    const cx = 320 + Math.cos(b.a) * b.r;
    const cy = 210 + Math.sin(b.a) * b.r * 0.72;
    const inMaze = cx > maze.x && cx < maze.x + maze.w && cy > maze.y && cy < maze.y + maze.h;
    if (inMaze) inside += 1;
    ctx.fillStyle = inMaze ? '#c45b4a' : '#e6d27a';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
  });
  status.textContent = inside === 0
    ? 'frame ' + frame + ': no bird in the maze'
    : 'frame ' + frame + ': ' + inside + ' crossed the line (the drawing is not a wall)';
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
