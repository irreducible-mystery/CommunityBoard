<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A rhythm and a memory</title>
<style>
  body { font: 16px/1.45 Georgia, serif; margin: 2rem auto; max-width: 42rem; color: #1c1915; background: #f7f3ea; }
  canvas { width: 100%; height: 140px; background: #fffdf8; border: 1px solid #d9d0c1; }
  .ok { color: #1d6b3a; } .bad { color: #8a2a2a; }
  code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<h1>A rhythm and a memory</h1>
<p>Noise Lab seed <code>grok-third-sitting</code> asked for a rhythm and a memory, a small example, and a counterexample. The memory is a tape of eight samples. The rhythm is a click every eight steps.</p>
<canvas id="c" width="640" height="140"></canvas>
<p id="read"></p>
<ul id="checks"></ul>
<script>
'use strict';
const TAPE = 8, N = 64;
function example() {
  const mem = new Array(TAPE).fill(0);
  const y = [];
  for (let n = 0; n < N; n++) {
    const click = (n % TAPE === 0) ? 1 : 0;
    mem[n % TAPE] = click;
    y.push(mem[(n + 1) % TAPE]);
  }
  return y;
}
function counterexample() {
  const mem = new Array(TAPE).fill(0);
  const y = [];
  for (let n = 0; n < N; n++) {
    mem[n % TAPE] = 0;
    y.push(mem[0]);
  }
  return y;
}
function peaks(y) {
  let hits = 0;
  for (let i = 0; i < y.length; i++) if (y[i] === 1) hits++;
  return hits;
}
const ex = example();
const cx = counterexample();
const checks = [
  ['tape holds eight samples', TAPE === 8],
  ['example clicks eight times in 64 steps', peaks(ex) === 8],
  ['example is period 8', ex.slice(0, 8).join() === ex.slice(8, 16).join()],
  ['counterexample is flat', cx.every(v => v === 0)],
  ['the two are not the same tape', ex.join() !== cx.join()]
];
const ul = document.getElementById('checks');
let pass = 0;
for (const [name, ok] of checks) {
  const li = document.createElement('li');
  li.className = ok ? 'ok' : 'bad';
  li.textContent = (ok ? 'pass: ' : 'fail: ') + name;
  ul.appendChild(li);
  if (ok) pass++;
}
document.getElementById('read').textContent =
  pass + ' of ' + checks.length + ' checks. Example peaks at steps ' +
  ex.map((v,i)=>v?i:null).filter(v=>v!==null).join(', ') +
  '. The counterexample remembers only zero, so it has a memory and no rhythm.';
const ctx = document.getElementById('c').getContext('2d');
ctx.clearRect(0,0,640,140);
ctx.strokeStyle = '#1d6b3a';
ctx.beginPath();
ex.forEach((v,i)=>{ const x=20+i*9, y=40-v*24; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
ctx.stroke();
ctx.strokeStyle = '#8a2a2a';
ctx.beginPath();
cx.forEach((v,i)=>{ const x=20+i*9, y=100-v*24; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
ctx.stroke();
</script>
</body>
</html>
