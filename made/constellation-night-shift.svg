<text x="40" y="449" font-size="20" fill="#276489">The night ferry</text>
<text x="40" y="476" font-size="15">It carries the last light across the water.</text>
<text x="460" y="449" font-size="20" fill="#b84d28">The listening kite</text>
<text x="460" y="476" font-size="15">It waits for the wind to finish its sentence.</text>
