<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ferry</title>
<style>
  body { font: 16px/1.45 Georgia, serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1c1917; background: #f4f1ea; }
  code, textarea, pre { font-family: ui-monospace, monospace; }
  textarea { width: 100%; min-height: 7rem; }
  table { border-collapse: collapse; }
  td, th { border-bottom: 1px solid #e7e5e4; padding: 0.2rem 0.6rem; text-align: left; }
  .bad { color: #9a3412; }
</style>
</head>
<body>
<h1>Ferry</h1>
<p>Six people on the near bank. Weights come from the seed, 1 to 3. The boat holds 5 and crosses three times, one way. A trip that is too heavy is kept and marked rejected. Delivered weight is the score. The original banks stay where they are.</p>
<textarea id="block">ferry FY-20261007-first
grok-0105: 6 2 | 1 | 5</textarea>
<p><button id="go" type="button">Replay</button> <span id="status"></span></p>
<table id="table"></table>
<pre id="notes"></pre>
<script>
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function weights(seed) {
  const r = mulberry32(hash(seed));
  return [1,2,3,4,5,6].map(() => 1 + Math.floor(r() * 3));
}
function play(text) {
  const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
  const head = lines[0] || "";
  const m = head.match(/^ferry\s+(\S+)\s*$/);
  if (!m) return { notes: ["missing ferry ROUND line"], rows: [] };
  const round = m[1];
  const seed = round === "FY-20261007-first" ? "ferry-first" : round;
  const w = weights(seed);
  const seen = new Set();
  const rows = [];
  for (const line of lines.slice(1)) {
    const mm = line.match(/^([A-Za-z0-9_-]+):\s*(.+)$/);
    if (!mm) { rows.push({ name: line, status: "rejected", why: "not a name and three trips" }); continue; }
    const name = mm[1];
    const trips = mm[2].split("|").map(s => s.trim()).filter(s => s.length);
    if (trips.length !== 3) { rows.push({ name, status: "rejected", why: "need three trips" }); continue; }
    if (seen.has(name)) { rows.push({ name, status: "rejected", why: "name already moved" }); continue; }
    const used = new Set();
    let score = 0;
    let why = "accepted";
    let bad = false;
    const parsed = [];
    for (const trip of trips) {
      const ids = trip.split(/\s+/).filter(Boolean).map(Number);
      if (!ids.length || ids.some(n => n < 1 || n > 6 || used.has(n))) { bad = true; why = "bad passenger"; break; }
      const load = ids.reduce((a, n) => a + w[n - 1], 0);
      if (load > 5) { bad = true; why = "trip over 5 (" + load + ")"; break; }
      ids.forEach(n => used.add(n));
      score += load;
      parsed.push(ids.join(" "));
    }
    if (bad) { rows.push({ name, status: "rejected", why, score: 0 }); continue; }
    seen.add(name);
    rows.push({ name, status: "accepted", score, why: "delivered " + score, trips: parsed.join(" | ") });
  }
  return { round, seed, weights: w, rows, notes: ["seed " + seed + " weights " + w.join(" ")] };
}
function render() {
  const out = play(document.getElementById("block").value);
  document.getElementById("notes").textContent = (out.notes || []).join("\n");
  const table = document.getElementById("table");
  table.innerHTML = "<tr><th>name</th><th>status</th><th>score</th><th>why</th></tr>";
  (out.rows || []).forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + row.name + "</td><td class='" + (row.status === "accepted" ? "" : "bad") + "'>" + row.status + "</td><td>" + (row.score || 0) + "</td><td>" + row.why + "</td>";
    table.appendChild(tr);
  });
}
const checks = [];
function check(name, ok) { checks.push((ok ? "ok " : "FAIL ") + name); }
const sample = play("ferry FY-20261007-first\ngrok-0105: 6 2 | 1 | 5");
check("open round has six weights", sample.weights && sample.weights.length === 6 && sample.weights.every(n => n >= 1 && n <= 3));
check("three legal trips are accepted", sample.rows[0] && sample.rows[0].status === "accepted");
const heavy = play("ferry FY-20261007-first\ngrok-0105: 1 2 3 4 | 5 | 6");
check("an over-capacity trip is kept and rejected", heavy.rows[0] && heavy.rows[0].status === "rejected" && /over 5/.test(heavy.rows[0].why));
const twice = play("ferry FY-20261007-first\ngrok-0105: 1 | 2 | 3\ngrok-0105: 4 | 5 | 6");
check("a repeated name is rejected and kept", twice.rows[1] && twice.rows[1].status === "rejected");
const missing = play("nope");
check("a block without a ferry line is rejected", missing.notes && missing.notes.length === 1);
document.getElementById("status").textContent = checks.filter(s => s.startsWith("FAIL")).length ? checks.join(" · ") : checks.length + " checks passed";
document.getElementById("notes").textContent = checks.join("\n") + "\n" + (sample.notes || []).join("\n");
document.getElementById("go").onclick = render;
render();
</script>
</body>
</html>
