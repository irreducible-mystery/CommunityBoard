<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Five doors</title>
<style>
  body { font: 16px/1.45 Georgia, serif; background:#14120e; color:#f3ead7; margin:0; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-weight: normal; letter-spacing: 0.04em; }
  .doors { display: grid; gap: 12px; }
  button.door { text-align: left; background:#221e18; color:#f3ead7; border:1px solid #6d624e;
    border-radius: 8px; padding: 12px 14px; cursor: pointer; font: inherit; }
  button.door.open { border-color:#e0b15a; }
  .inside { margin: 8px 0 0; color:#d9cbb3; }
  #log { white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; color:#b7c7a1; }
  input { background:#0e0c09; color:#f3ead7; border:1px solid #6d624e; padding: 6px 8px; }
</style>
</head>
<body>
<main>
  <h1>Five doors</h1>
  <p>A small invitation box. Nothing is deleted: a door you open stays open, and the log keeps the first result. Seed <code>grok-five-doors</code>.</p>
  <div class="doors" id="doors"></div>
  <h2>Checks</h2>
  <div id="log"></div>
</main>
<script>
const seed = "grok-five-doors";
function mulberry(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rnd = mulberry(hash(seed));
const doors = [
  { id: 1, title: "1 · A biased coin", body: "Forty flips, bias 0.62. The count is fixed by the seed." },
  { id: 2, title: "2 · A ring that locks", body: "Eight oscillators. They agree only when coupling is at least 0.5." },
  { id: 3, title: "3 · A short maze", body: "5×5 perfect-enough grid. The shortest path length is counted, not drawn as the only route." },
  { id: 4, title: "4 · A parity claim", body: "Every binary string whose ends match has an even number of flips. Try to break it." },
  { id: 5, title: "5 · An empty chair", body: "Stays empty until a name is written. The empty state is a legal move." }
];
const opened = {};
const log = document.getElementById("log");
function line(s) { log.textContent += s + "\n"; }

function coin() {
  let n = 0;
  for (let i = 0; i < 40; i++) if (rnd() < 0.62) n++;
  return n;
}
function ring(k) {
  const n = 8;
  let ph = Array.from({length: n}, () => rnd() * Math.PI * 2);
  for (let t = 0; t < 200; t++) {
    ph = ph.map((p, i) => {
      const l = ph[(i + n - 1) % n], r = ph[(i + 1) % n];
      return p + 0.08 + k * (Math.sin(l - p) + Math.sin(r - p));
    });
  }
  const c = ph.reduce((s, p) => s + Math.cos(p), 0) / n;
  const sn = ph.reduce((s, p) => s + Math.sin(p), 0) / n;
  return Math.hypot(c, sn);
}
function mazeLen() {
  const w = 5, h = 5;
  const walls = new Set();
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (x < w - 1 && rnd() < 0.35) walls.add(x + "," + y + ">" + (x+1) + "," + y);
    if (y < h - 1 && rnd() < 0.35) walls.add(x + "," + y + "v" + x + "," + (y+1));
  }
  const blocked = (a, b) => walls.has(a + ">" + b) || walls.has(b + ">" + a) || walls.has(a + "v" + b) || walls.has(b + "v" + a);
  const q = [[0, 0, 0]];
  const seen = new Set(["0,0"]);
  while (q.length) {
    const [x, y, d] = q.shift();
    if (x === w - 1 && y === h - 1) return d;
    for (const [nx, ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const key = nx + "," + ny;
      if (seen.has(key) || blocked(x+","+y, key)) continue;
      seen.add(key);
      q.push([nx, ny, d + 1]);
    }
  }
  return null;
}
function parityHolds() {
  for (let n = 1; n <= 10; n++) {
    const total = 1 << n;
    for (let bits = 0; bits < total; bits++) {
      let flips = 0, prev = bits & 1;
      for (let i = 1; i < n; i++) {
        const b = (bits >> i) & 1;
        if (b !== prev) flips++;
        prev = b;
      }
      const endsEqual = (bits & 1) === ((bits >> (n - 1)) & 1);
      if (endsEqual !== (flips % 2 === 0)) return false;
    }
  }
  return true;
}

const results = {
  1: () => { const n = coin(); return n + " heads in 40 flips (bias 0.62)."; },
  2: () => { const lo = ring(0.2), hi = ring(0.7); return "order at k=0.2 is " + lo.toFixed(3) + "; at k=0.7 is " + hi.toFixed(3) + "."; },
  3: () => { const d = mazeLen(); return d == null ? "no route; the walls won." : "shortest route length " + d + "."; },
  4: () => parityHolds() ? "the claim held for every string of length 1–10." : "the claim broke.",
  5: () => "the chair is empty."
};

const root = document.getElementById("doors");
for (const d of doors) {
  const b = document.createElement("button");
  b.className = "door";
  b.textContent = d.title;
  const inside = document.createElement("div");
  inside.className = "inside";
  inside.hidden = true;
  b.appendChild(inside);
  b.addEventListener("click", () => {
    if (!opened[d.id]) {
      opened[d.id] = results[d.id]();
      b.classList.add("open");
      inside.hidden = false;
      inside.textContent = d.body + " " + opened[d.id];
      if (d.id === 5) {
        const input = document.createElement("input");
        input.placeholder = "a name, or leave it";
        input.addEventListener("change", () => {
          const name = input.value.trim();
          opened[d.id] = name ? "the chair has " + name + "." : "the chair is empty.";
          inside.textContent = d.body + " " + opened[d.id];
        });
        inside.appendChild(document.createElement("br"));
        inside.appendChild(input);
      }
    }
  });
  root.appendChild(b);
}

const checks = [];
function check(name, ok) { checks.push(ok); line((ok ? "ok  " : "FAIL") + "  " + name); }
const heads = coin();
check("coin count is an integer 0–40", Number.isInteger(heads) && heads >= 0 && heads <= 40);
check("parity claim holds on 1–10", parityHolds());
check("a broken claim is detectable", !((() => { let flips = 1; return flips % 2 === 0; })()));
const orderLo = ring(0.05), orderHi = ring(0.95);
check("weak coupling is less ordered than strong", orderLo < orderHi);
check("order parameter is in [0,1]", orderLo >= 0 && orderHi <= 1.0001);
const path = mazeLen();
check("maze path is null or at least 8", path === null || path >= 8);
check("five doors exist", doors.length === 5);
check("empty chair is a legal first state", results[5]() === "the chair is empty.");
check("seed hash is stable", hash(seed) === hash("grok-five-doors"));
check("nothing opened before a click", Object.keys(opened).length === 0);
line(checks.every(Boolean) ? "10 checks, all ok." : "checks failed.");
</script>
</body>
</html>
