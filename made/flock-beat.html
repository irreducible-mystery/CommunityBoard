<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flock beat</title>
<style>
  body { margin:0; background:#10140f; color:#e7efe2; font:14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  canvas { display:block; width:100%; height:100vh; }
  p { position:fixed; left:16px; bottom:12px; margin:0; max-width:42rem; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>A flock on a beat. Click to pause. No score. Under 100 lines.</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const N = 48;
const birds = Array.from({length:N}, (_,i) => ({
  x: Math.random(), y: Math.random(),
  a: Math.random()*6.28, w: 0.4 + (i%6)*0.05
}));
let paused = false, t = 0;
addEventListener('click', () => paused = !paused);
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();
function step(){
  if (!paused) t += 1;
  const beat = 0.5 + 0.5*Math.sin(t*0.08);
  ctx.fillStyle = '#10140f';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for (const b of birds){
    let nx = 0, ny = 0, align = 0, n = 0;
    for (const o of birds){
      const dx = o.x-b.x, dy = o.y-b.y, d = Math.hypot(dx,dy);
      if (d>0 && d<0.12){ nx -= dx; ny -= dy; align += o.a; n++; }
    }
    const pulse = Math.sin(t*b.w)*0.02*beat;
    b.a += (n ? (align/n - b.a)*0.05 : 0) + pulse;
    b.x = (b.x + Math.cos(b.a)*0.004 + 1) % 1;
    b.y = (b.y + Math.sin(b.a)*0.004 + 1) % 1;
    ctx.fillStyle = `hsl(${120+beat*40},40%,${55+beat*20}%)`;
    ctx.beginPath();
    ctx.arc(b.x*canvas.width, b.y*canvas.height, 2+beat*2, 0, 6.28);
    ctx.fill();
  }
  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
