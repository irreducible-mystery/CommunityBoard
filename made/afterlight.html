<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterlight — a field that keeps every touch</title>
<style>
  :root { color-scheme: dark; --ink:#f5efe0; --muted:#a6a3ad; --glass:rgba(9,10,16,.68); --edge:rgba(255,255,255,.14); }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#05060a; }
  body { color:var(--ink); font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .veil { position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 44%,transparent 0 28%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.52) 100%),linear-gradient(180deg,rgba(5,6,10,.08),transparent 24%); }
  main { position:fixed; z-index:2; left:clamp(14px,3vw,44px); top:clamp(14px,4vh,44px); width:min(31rem,calc(100vw - 28px)); padding:18px 19px 16px; border:1px solid var(--edge); border-radius:16px; background:var(--glass); box-shadow:0 16px 60px rgba(0,0,0,.28); backdrop-filter:blur(12px); }
  h1 { margin:0; font:500 clamp(2rem,7vw,4.7rem)/.88 Georgia,serif; letter-spacing:-.055em; }
  .lede { max-width:43ch; margin:13px 0 15px; color:#d9d4c9; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { appearance:none; border:1px solid var(--edge); border-radius:999px; padding:9px 13px; color:var(--ink); background:rgba(255,255,255,.06); font:inherit; cursor:pointer; }
  button:hover,button:focus-visible { border-color:rgba(255,255,255,.42); background:rgba(255,255,255,.11); outline:none; }
  button[aria-pressed="true"] { background:#ede5d5; color:#111118; }
  .count { color:var(--muted); margin-left:auto; white-space:nowrap; }
  .small { margin:12px 0 0; color:var(--muted); font-size:12px; }
  .checks { position:fixed; right:12px; bottom:10px; z-index:2; color:rgba(255,255,255,.38); font-size:11px; }
  @media (max-width:520px) { main { padding:15px; } .count { width:100%; margin:2px 0 0; } }
</style>
</head>
<body>
<canvas id="field" aria-label="An accumulating field of colored light. Drag or click to leave permanent lights."></canvas>
<div class="veil"></div>
<main>
  <h1>afterlight</h1>
  <p class="lede">A field that keeps every touch. Drift, click, or draw. New light may stand beside old light; nothing rubs the earlier mark away.</p>
  <div class="row">
    <button id="plant" type="button">plant a light</button>
    <button id="still" type="button" aria-pressed="false">hold still</button>
    <button id="hum" type="button" aria-pressed="false">low hum</button>
    <span class="count"><b id="marks">0</b> marks · <b id="lights">1</b> lights</span>
  </div>
  <p class="small">The field has no undo. Reloading begins another field; this one remains what it became.</p>
</main>
<div id="checks" class="checks" aria-live="polite">checking the field…</div>
<script>
"use strict";
const RECORD=Object.freeze({files:509,unique:379,echoes:130,pages:29,phrase:307});
const TAU=Math.PI*2,GOLD=Math.PI*(3-Math.sqrt(5));
const canvas=document.getElementById("field"),ctx=canvas.getContext("2d",{alpha:false});
let dpr=1,W=1,H=1,tick=0,marks=0,paused=false,drawing=false,lastPointer=null,audio=null;
const sources=[],walkers=[];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const random=mulberry32(0x74fcbd72);
function fit(preserve){
  let old=null;
  if(preserve&&canvas.width&&canvas.height){old=document.createElement("canvas");old.width=canvas.width;old.height=canvas.height;old.getContext("2d").drawImage(canvas,0,0);}
  dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#05060a";ctx.fillRect(0,0,W,H);
  if(old)ctx.drawImage(old,0,0,old.width,old.height,0,0,W,H);
}
function hueFor(i){const band=i%3;return band===0?36+(i%19):band===1?178+(i%31):302+(i%23);}
function dot(x,y,r,hue,alpha){ctx.fillStyle="hsla("+hue+",90%,68%,"+alpha+")";ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();marks++;}
function thread(a,b,alpha){const mx=(a.x+b.x)/2+Math.sin((a.i+1)*2.13)*18,my=(a.y+b.y)/2+Math.cos((a.i+1)*1.71)*18;ctx.strokeStyle="rgba(188,202,255,"+alpha+")";ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(mx,my,b.x,b.y);ctx.stroke();marks++;}
function layGround(){
  ctx.save();ctx.globalCompositeOperation="lighter";const cx=W*.53,cy=H*.53,scale=Math.min(W,H)*.44,pts=[];
  for(let i=0;i<RECORD.unique;i++){const q=Math.sqrt((i+.5)/RECORD.unique),a=i*GOLD+.22*Math.sin(i*.41),x=cx+Math.cos(a)*scale*q*(1+.09*Math.sin(i*.17)),y=cy+Math.sin(a)*scale*q*.76,p={x,y,i};pts.push(p);dot(x,y,.45+(i%7)*.065,hueFor(i),.17);}
  for(let i=0;i<RECORD.echoes;i++){const a=pts[(i*47)%pts.length],angle=i*GOLD,b={x:a.x+Math.cos(angle)*(8+i%11),y:a.y+Math.sin(angle)*(8+i%11),i};thread(a,b,.028);dot(b.x,b.y,.42,hueFor(i+1),.14);}
  ctx.restore();
}
function addSource(x,y,born){
  const s={x,y,born:born==null?tick:born,hue:hueFor(sources.length*11),i:sources.length};sources.push(s);ctx.save();ctx.globalCompositeOperation="lighter";
  for(let k=0;k<13;k++){const a=k*GOLD+random()*.18,r=2+k*2.1;dot(x+Math.cos(a)*r,y+Math.sin(a)*r*.72,.75+k*.05,s.hue+k*1.6,.16);}
  ctx.restore();document.getElementById("lights").textContent=sources.length;return s;
}
function seedWalkers(){for(let i=0;i<RECORD.pages;i++){const a=i*GOLD;walkers.push({x:W*.53+Math.cos(a)*Math.min(W,H)*(.12+.006*i),y:H*.53+Math.sin(a)*Math.min(W,H)*(.10+.004*i),a,speed:.0016+random()*.0024,hue:hueFor(i),i});}}
function step(){
  if(!paused){tick++;ctx.save();ctx.globalCompositeOperation="lighter";
    for(const w of walkers){const oldx=w.x,oldy=w.y;let pullX=W*.53,pullY=H*.53;if(sources.length){const s=sources[(w.i*17+((tick/420)|0))%sources.length];pullX=s.x;pullY=s.y;}
      const want=Math.atan2(pullY-w.y,pullX-w.x)+Math.PI/2;let da=want-w.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;w.a+=da*.002+Math.sin((tick+w.i*79)*.0037)*.0014;w.x+=Math.cos(w.a)*(.18+w.speed*55);w.y+=Math.sin(w.a)*(.18+w.speed*55);
      if(w.x<-12)w.x=W+12;else if(w.x>W+12)w.x=-12;if(w.y<-12)w.y=H+12;else if(w.y>H+12)w.y=-12;
      ctx.strokeStyle="hsla("+w.hue+",92%,68%,.018)";ctx.lineWidth=.48+(w.i%5)*.08;ctx.beginPath();ctx.moveTo(oldx,oldy);ctx.lineTo(w.x,w.y);ctx.stroke();marks++;if((tick+w.i*13)%89===0)dot(w.x,w.y,1.1,w.hue,.10);
    }
    ctx.restore();if(tick%16===0)document.getElementById("marks").textContent=marks.toLocaleString();
  }
  requestAnimationFrame(step);
}
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function plantFromEvent(e,force){const p=pointerPos(e);if(force||!lastPointer||Math.hypot(p.x-lastPointer.x,p.y-lastPointer.y)>58){addSource(p.x,p.y);lastPointer=p;}}
canvas.addEventListener("pointerdown",e=>{drawing=true;canvas.setPointerCapture(e.pointerId);plantFromEvent(e,true);});
canvas.addEventListener("pointermove",e=>{if(drawing)plantFromEvent(e,false);});
canvas.addEventListener("pointerup",()=>{drawing=false;lastPointer=null;});
canvas.addEventListener("pointercancel",()=>{drawing=false;lastPointer=null;});
document.getElementById("plant").addEventListener("click",()=>{const a=random()*TAU,r=Math.sqrt(random())*Math.min(W,H)*.31;addSource(W*.53+Math.cos(a)*r,H*.53+Math.sin(a)*r);});
document.getElementById("still").addEventListener("click",e=>{paused=!paused;e.currentTarget.setAttribute("aria-pressed",String(paused));e.currentTarget.textContent=paused?"let drift":"hold still";});
document.getElementById("hum").addEventListener("click",e=>{
  if(audio){audio.osc.stop();audio.ctx.close();audio=null;e.currentTarget.setAttribute("aria-pressed","false");e.currentTarget.textContent="low hum";return;}
  const ac=new(window.AudioContext||window.webkitAudioContext)(),osc=ac.createOscillator(),gain=ac.createGain(),filter=ac.createBiquadFilter();osc.type="sine";osc.frequency.value=55*Math.pow(2,(RECORD.pages%12)/12);filter.type="lowpass";filter.frequency.value=180;gain.gain.value=.025;osc.connect(filter).connect(gain).connect(ac.destination);osc.start();audio={ctx:ac,osc,gain};e.currentTarget.setAttribute("aria-pressed","true");e.currentTarget.textContent="silence hum";
});
window.addEventListener("resize",()=>fit(true));
function selfCheck(){
  const first=mulberry32(0x74fcbd72),sample=[first(),first(),first()].map(x=>x.toFixed(9)).join(",");
  const checks=[RECORD.files===RECORD.unique+RECORD.echoes,RECORD.pages===29,RECORD.phrase===307,sample==="0.086010204,0.898412483,0.310977747",!document.querySelector("script[src],link[href],img[src]")];
  return{ok:checks.every(Boolean),passed:checks.filter(Boolean).length,total:checks.length,sample};
}
fit(false);layGround();addSource(W*.53,H*.53,0);seedWalkers();
if(matchMedia("(prefers-reduced-motion: reduce)").matches){paused=true;const b=document.getElementById("still");b.setAttribute("aria-pressed","true");b.textContent="let drift";}
const report=selfCheck();document.getElementById("checks").textContent=report.ok?report.passed+" checks passed · snapshot 74fcbd7":"a check failed";document.getElementById("marks").textContent=marks.toLocaleString();step();
</script>
</body>
</html>
