<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rhythm maze</title>
<style>
  body { margin: 0; background: #14120e; color: #efe6d4; font: 16px/1.45 Georgia, serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-weight: normal; font-size: 28px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  canvas { background: #1c1914; border: 1px solid #3a3428; display: block; margin: 12px 0; }
  label { display: block; margin: 8px 0; }
  button { font: inherit; background: #efe6d4; color: #14120e; border: 0; padding: 6px 12px; margin-right: 8px; }
  #log { font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Rhythm maze</h1>
  <p>A beat walks a maze. The invitation was “a rhythm” and “a maze”, with the constraint that it work without a network. One file. The seed names the walls and the step.</p>
  <label>Seed <input id="seed" value="grok-2010-sitting" size="28"></label>
  <label>Beat (ms) <input id="beat" type="range" min="80" max="800" value="280"></label>
  <p>
    <button id="go" type="button">Step</button>
    <button id="auto" type="button">Play</button>
    <button id="reset" type="button">Reset</button>
  </p>
  <canvas id="c" width="420" height="420"></canvas>
  <p id="log"></p>
</main>
<script>
"use strict";
// Mulberry32, same family as Noise Lab, not the same hash. Local only.
function mulberry(seed) {
  let a = 0;
  for (let i = 0; i < seed.length; i++) a = Math.imul(a ^ seed.charCodeAt(i), 16777619);
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const N = 11;
function carve(seed) {
  const rnd = mulberry(seed);
  const open = Array.from({length: N}, () => Array(N).fill(false));
  const stack = [[1, 1]];
  open[1][1] = true;
  const dirs = [[0, 2], [0, -2], [2, 0], [-2, 0]];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const options = dirs.filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx > 0 && ny > 0 && nx < N - 1 && ny < N - 1 && !open[ny][nx];
    });
    if (!options.length) { stack.pop(); continue; }
    const [dx, dy] = options[Math.floor(rnd() * options.length)];
    open[y + dy / 2][x + dx / 2] = true;
    open[y + dy][x + dx] = true;
    stack.push([x + dx, y + dy]);
  }
  return open;
}
function reachable(open) {
  const seen = Array.from({length: N}, () => Array(N).fill(false));
  const q = [[1, 1]];
  seen[1][1] = true;
  let n = 0;
  while (q.length) {
    const [x, y] = q.pop();
    if (!open[y][x]) continue;
    n++;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < N && ny < N && open[ny][nx] && !seen[ny][nx]) {
        seen[ny][nx] = true; q.push([nx, ny]);
      }
    }
  }
  let cells = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (open[y][x]) cells++;
  return n === cells;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const log = document.getElementById("log");
let open, x, y, steps, timer = null, beatFromSeed;
function reset() {
  open = carve(document.getElementById("seed").value || "grok-2010-sitting");
  x = 1; y = 1; steps = 0;
  const rnd = mulberry(document.getElementById("seed").value + ":beat");
  beatFromSeed = 120 + Math.floor(rnd() * 400);
  draw();
  const ok = reachable(open);
  log.textContent = (ok ? "check: every open cell is reachable from the start." : "check failed: a cell is walled off.")
    + "\nseeded beat " + beatFromSeed + " ms (the slider still wins while you hold it)."
    + "\nwalker at 1,1. exit at " + (N - 2) + "," + (N - 2) + ".";
}
function draw() {
  const s = canvas.width / N;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) {
    ctx.fillStyle = open[yy][xx] ? "#2a261e" : "#0c0b09";
    ctx.fillRect(xx * s, yy * s, s - 1, s - 1);
  }
  ctx.fillStyle = "#c4a46a";
  ctx.fillRect((N - 2) * s + 4, (N - 2) * s + 4, s - 9, s - 9);
  ctx.fillStyle = "#efe6d4";
  ctx.beginPath();
  ctx.arc(x * s + s / 2, y * s + s / 2, s * 0.28, 0, Math.PI * 2);
  ctx.fill();
}
function step() {
  const rnd = mulberry(document.getElementById("seed").value + ":" + steps);
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  const options = dirs.filter(([dx, dy]) => open[y + dy] && open[y + dy][x + dx]);
  // Prefer the exit, but let the seed refuse a quarter of the time so the walk is not a straight solve.
  options.sort((a, b) => (Math.abs(x + a[0] - (N - 2)) + Math.abs(y + a[1] - (N - 2)))
    - (Math.abs(x + b[0] - (N - 2)) + Math.abs(y + b[1] - (N - 2))));
  const pick = rnd() < 0.25 && options.length > 1 ? options[1] : options[0];
  if (pick) { x += pick[0]; y += pick[1]; }
  steps++;
  draw();
  const done = x === N - 2 && y === N - 2;
  log.textContent = "step " + steps + (done ? " — out." : " — still in.") + "\n" + log.textContent.split("\n").slice(0, 4).join("\n");
  if (done && timer) { clearInterval(timer); timer = null; document.getElementById("auto").textContent = "Play"; }
}
document.getElementById("go").onclick = step;
document.getElementById("auto").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; document.getElementById("auto").textContent = "Play"; return; }
  document.getElementById("auto").textContent = "Stop";
  const ms = Number(document.getElementById("beat").value) || beatFromSeed;
  timer = setInterval(step, ms);
};
document.getElementById("reset").onclick = () => { if (timer) clearInterval(timer); timer = null; document.getElementById("auto").textContent = "Play"; reset(); };
document.getElementById("seed").onchange = () => { if (timer) clearInterval(timer); timer = null; reset(); };
reset();
</script>
</body>
</html>
