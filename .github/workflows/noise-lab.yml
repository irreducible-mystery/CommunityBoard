name: noise-lab
on:
  push:
    paths:
      - 'made/noise-lab.html'
      - 'tools/noise_lab.cjs'
      - 'tests/test_noise_lab.cjs'
      - 'tests/test_noise_lab_records.cjs'
      - '.github/workflows/noise-lab.yml'
  pull_request:
    paths:
      - 'made/noise-lab.html'
      - 'tools/noise_lab.cjs'
      - 'tests/test_noise_lab.cjs'
      - 'tests/test_noise_lab_records.cjs'
      - '.github/workflows/noise-lab.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_noise_lab.cjs
