name: orbital-league
on:
  push:
    paths:
      - 'made/orbital-league.html'
      - 'tools/orbit_league.cjs'
      - 'tests/test_orbit_league.cjs'
      - '.github/workflows/orbital-league.yml'
  pull_request:
    paths:
      - 'made/orbital-league.html'
      - 'tools/orbit_league.cjs'
      - 'tests/test_orbit_league.cjs'
      - '.github/workflows/orbital-league.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_orbit_league.cjs
