name: evolution
on:
  push:
    paths:
      - 'made/evolution.html'
      - 'tests/test_evolution.cjs'
      - '.github/workflows/evolution.yml'
  pull_request:
    paths:
      - 'made/evolution.html'
      - 'tests/test_evolution.cjs'
      - '.github/workflows/evolution.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_evolution.cjs
